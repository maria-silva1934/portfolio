<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria Silva — Portfolio Thumbnail</title>
<style>
  /* ============================================================
     MARIA SILVA — PORTFOLIO THUMBNAIL
     Standalone 1200×630 card matching the site's visual identity
     ============================================================ */

  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    /* Palette — mirrors css/styles.css design tokens */
    --color-bg: #faf9f7;
    --color-surface: #ffffff;
    --color-text: #1c1c1c;
    --color-text-soft: #55524e;
    --color-text-muted: #8a867f;
    --color-accent: #8a6d3b;
    --color-accent-dark: #6f5730;
    --color-border: #e4e1dc;
    --color-border-strong: #d3cfc8;

    /* Typography — mirrors site fonts */
    --font-serif: "Georgia", "Times New Roman", serif;
    --font-sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: var(--font-sans);
    color: var(--color-text);
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- Canvas ---------- */
  .thumbnail {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px 72px 48px;
    background:
      radial-gradient(ellipse 55% 45% at 85% 10%, rgba(138, 109, 59, 0.06), transparent),
      var(--color-bg);
  }

  /* Inner hairline frame — premium card feel */
  .thumbnail::before {
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid var(--color-border);
    border-radius: 16px;
    pointer-events: none;
  }

  /* ---------- Top bar ---------- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: var(--color-text);
    color: var(--color-bg);
    font-family: var(--font-serif);
    font-size: 1.15rem;
    border-radius: 10px;
  }

  .brand-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  .top-tag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
    border: 1px solid var(--color-border-strong);
    border-radius: 999px;
    padding: 8px 18px;
  }

  /* ---------- Center content ---------- */
  .center {
    text-align: center;
    padding: 0 40px;
  }

  .name {
    font-family: var(--font-serif);
    font-size: 84px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: var(--color-text);
    margin-bottom: 28px;
  }

  .divider {
    width: 64px;
    height: 2px;
    background: var(--color-accent);
    margin: 0 auto 28px;
    border-radius: 2px;
  }

  .role {
    font-size: 30px;
    font-weight: 500;
    color: var(--color-accent);
    letter-spacing: 0.01em;
    margin-bottom: 10px;
  }

  .subrole {
    font-size: 19px;
    font-weight: 400;
    color: var(--color-text-soft);
    letter-spacing: 0.02em;
  }

  /* ---------- Bottom skills line ---------- */
  .skills {
    text-align: center;
  }

  .skills-line {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .skills-line .dot {
    color: var(--color-accent);
    margin: 0 12px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="thumbnail">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-mark">MS</div>
        <span class="brand-label">Portfolio</span>
      </div>
      <span class="top-tag">AI Evaluation</span>
    </div>

    <!-- Center -->
    <div class="center">
      <h1 class="name">MARIA SILVA</h1>
      <div class="divider"></div>
      <p class="role">AI Evaluation</p>
      <p class="subrole">Research & Digital Operations</p>
    </div>

    <!-- Bottom -->
    <div class="skills">
      <p class="skills-line">
        AI Response Evaluation <span class="dot">·</span>
        Fact-Checking <span class="dot">·</span>
        E-commerce <span class="dot">·</span>
        Customer Support
      </p>
    </div>
  </div>
</body>
</html>
